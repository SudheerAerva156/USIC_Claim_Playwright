name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'QA_UPGRADE'
        type: choice
        options:
          - DEV
          - DEVAT
          - QA
          - QA2
          - CLOUDQA
          - UAT
          - QA_UPGRADE
      suite:
        description: 'Test suite tag to execute'
        required: true
        default: '@smoke'
        type: choice
        options:
          - '@smoke'
          - '@regression'
          - '@sanity'
          - 'all'

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          ENV: ${{ github.event.inputs.environment || 'QA_UPGRADE' }}
        run: |
          if [ "${{ github.event.inputs.suite }}" = "all" ] || [ -z "${{ github.event.inputs.suite }}" ]; then
            npx cross-env ENV=$ENV npx playwright test
          else
            npx cross-env ENV=$ENV npx playwright test --grep "${{ github.event.inputs.suite }}"
          fi

      - name: Generate Allure Report
        if: always()
        run: |
          npm run allure:generate

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
